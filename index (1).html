<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جمعية أبناء زرنيخ – جمعية أهلية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g:#0f5132;--g2:#198754;--bg:#f4f6f5;--b:#dfe5e2;--t:#1c2a24;--r:#b02a37}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px;
background:radial-gradient(circle at 20% 20%,#2f9e6f55,transparent 40%),radial-gradient(circle at 80% 80%,#e0b45a55,transparent 40%),linear-gradient(135deg,#0b3d2a,#14583c 55%,#1b6b4a)}
.card{background:#fff;border-radius:18px;padding:36px 30px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px #0006}
.card h1{font-size:22px;margin:8px 0 4px;color:var(--g)}.card p{color:#667;margin:0 0 22px}
.logo{width:72px;height:72px;border-radius:50%;background:var(--g);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;font-size:14px;background:var(--g2);color:#fff}
button.sec{background:#e9eeec;color:var(--t)}button.red{background:var(--r)}button.sm{padding:4px 10px;font-size:13px}
.gbtn{width:100%;padding:12px;font-size:16px;background:#fff;color:#222;border:1px solid #ccc;display:flex;gap:10px;justify-content:center;align-items:center}
.err{color:var(--r);margin-top:14px;font-size:14px}
#app{display:none}
header{background:var(--g);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-size:18px}header span{font-size:13px;opacity:.9}
nav{background:#fff;border-bottom:1px solid var(--b);display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{background:none;color:var(--t);border-radius:0;padding:14px 18px;border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--g2);font-weight:700}
main{padding:20px;max-width:1200px;margin:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px;border:1px solid var(--b);border-radius:8px;width:100%;background:#fff}
.bar input{width:auto;flex:1;min-width:200px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--b);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--b);text-align:right;vertical-align:middle}
th{background:#eef3f0;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#dde}
.tag{background:#fde8ea;color:var(--r);padding:2px 8px;border-radius:10px;font-size:12px}
.ok{background:#e0f3e8;color:var(--g)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.mb{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:760px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}label{font-size:13px;color:#456;display:block;margin-bottom:3px}
.pay{display:grid;grid-template-columns:90px 1fr 1fr 40px;gap:6px;margin-bottom:6px}
.empty{padding:30px;text-align:center;color:#778}
.det{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin:12px 0}.det div{padding:6px 0;border-bottom:1px dashed var(--b)}
.kid{display:grid;grid-template-columns:1fr 170px 40px;gap:6px;margin-bottom:6px}
#printArea{display:none}
@media(max-width:640px){.grid,.det{grid-template-columns:1fr}.pay{grid-template-columns:1fr 1fr}.kid{grid-template-columns:1fr 1fr}}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}
#printArea table{font-size:12px}#printArea h2{text-align:center}}
</style>
</head>
<body>
<div id="setup" style="display:none;padding:30px;max-width:640px;margin:auto"><h2>الإعداد غير مكتمل</h2><p>الصق إعدادات Firebase في المتغير <code>firebaseConfig</code> داخل ملف index.html (راجع الخطوات).</p></div>
<div id="login"><div class="card"><div class="logo">ز</div><h1>جمعية أبناء زرنيخ</h1><p>جمعية أهلية – نظام إدارة الأعضاء</p>
<button class="gbtn" id="gl"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 010-9.4l-7.9-6.1a24 24 0 000 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>الدخول بحساب Google</button>
<div class="err" id="lerr"></div></div></div>

<div id="app">
<header><b>جمعية أبناء زرنيخ – جمعية أهلية</b><span><span id="who"></span> · <button class="sm sec" id="out">خروج</button></span></header>
<nav id="nav"></nav><main id="main"></main>
</div>
<div class="modal" id="modal"><div class="mb" id="mb"></div></div>
<div id="printArea"></div>

<script type="module">
// ======= الصق إعدادات Firebase هنا =======
const firebaseConfig = {
  apiKey: "AIzaSyBLP32yvmUMPBqVrY9JIInoSIQOrb9qZws",
  authDomain: "arsenic-association.firebaseapp.com",
  projectId: "arsenic-association",
  appId: "1:112154538066:web:f0cf906e98c587f906af8b"
};
const ROOT = "sons.of.arsenic@gmail.com";
// =========================================
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(firebaseConfig.apiKey.startsWith("PASTE")){$("#setup").style.display="block";throw new Error("config")}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const S={role:null,email:"",tab:"inq",members:[],courses:[],board:[],users:[],unsubs:[]};
const STATUS=["عضو عامل","موقوف","مسقط","منتقل","متوفى"];
const ROLES={admin:"مدير النظام",staff:"موظف",viewer:"مستخدم استعلام"};
const canEdit=()=>S.role==="admin"||S.role==="staff",isAdmin=()=>S.role==="admin";
let loginMsg="";

$("#gl").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider(),).catch(e=>{$("#lerr").textContent="تعذر تسجيل الدخول: "+e.code});
$("#out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  S.unsubs.forEach(f=>f());S.unsubs=[];
  if(!u){$("#app").style.display="none";$("#login").style.display="flex";$("#lerr").textContent=loginMsg;loginMsg="";return}
  const em=(u.email||"").toLowerCase();let role=null,name=u.displayName||em;
  if(em===ROOT)role="admin";
  else{try{const d=await getDoc(doc(db,"users",em));if(d.exists())role=d.data().role}catch(e){}}
  if(!role||!ROLES[role]){loginMsg="هذا الحساب ("+em+") غير مسموح له بالدخول. تواصل مع مدير النظام.";await signOut(auth);return}
  S.role=role;S.email=em;
  $("#who").textContent=name+" – "+ROLES[role];
  $("#login").style.display="none";$("#app").style.display="block";
  S.tab="inq";S.vres=null;const cols=S.role==="viewer"?[]:["members","courses","board"].concat(isAdmin()?["users"]:[]);
  cols.forEach(c=>S.unsubs.push(onSnapshot(collection(db,c),sn=>{S[c]=sn.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{$("#main").innerHTML='<div class="empty">تعذر تحميل البيانات: '+esc(e.code)+'</div>'})));
  render();
});

// ---------- أدوات ----------
const yr=new Date().getFullYear();
const age=b=>{if(!b)return"";const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0?a:""};
const arrears=m=>{if(m.status!=="عضو عامل"||!m.joinDate)return[];const s=+m.joinDate.slice(0,4),paid=new Set((m.payments||[]).map(p=>+p.year)),r=[];for(let y=s;y<=yr;y++)if(!paid.has(y))r.push(y);return r};
const nm=v=>String(v||"").trim();
const nk=s=>String(s||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim().toLowerCase().replace(/\//g,"-");
const idxSet=async m=>{await setDoc(doc(db,"names",nk(m.fullName)),{nids:arrayUnion(m.nid)},{merge:true});if(nk(m.family))await setDoc(doc(db,"names","f_"+nk(m.family)),{nids:arrayUnion(m.nid)},{merge:true})};
const idxDel=async m=>{await setDoc(doc(db,"names",nk(m.fullName)),{nids:arrayRemove(m.nid)},{merge:true});if(nk(m.family))await setDoc(doc(db,"names","f_"+nk(m.family)),{nids:arrayRemove(m.nid)},{merge:true})};
async function vSearch(){const q=nm($("#q").value);if(!q)return;const T=$("#tbl");T.innerHTML='<div class="empty">جارٍ البحث…</div>';
try{let ids=[];if(/^\d{14}$/.test(q))ids=[q];else{for(const k of [nk(q),"f_"+nk(q)]){const d=await getDoc(doc(db,"names",k));if(d.exists())ids.push(...(d.data().nids||[]))}ids=[...new Set(ids)].slice(0,50)}
const L=[];for(const i of ids){const d=await getDoc(doc(db,"members",i));if(d.exists())L.push({id:d.id,...d.data()})}
S.vres=L;fillTable()}catch(e){T.innerHTML='<div class="empty">تعذر البحث: '+esc(e.code)+'</div>'}}
const NAV=[["inq","الاستعلام"],["mem","الأفراد"],["crs","الدورات"],["brd","مجلس الإدارة"]];
function render(){
  const nav=S.role==="viewer"?[NAV[0]]:NAV.concat(isAdmin()?[["usr","المستخدمون"]]:[]);
  $("#nav").innerHTML=nav.map(([k,t])=>`<button class="${S.tab===k?"on":""}" data-tab="${k}">${t}</button>`).join("");
  const v={inq:vInq,mem:vMem,crs:()=>vGen("courses"),brd:()=>vGen("board"),usr:vUsr}[S.tab]||vInq;
  $("#main").innerHTML=v();
  if(S.tab==="inq"||S.tab==="mem")fillTable();
  if(S.role==="viewer"){$("#vs").onclick=vSearch;$("#q").onkeydown=ev=>{if(ev.key==="Enter")vSearch()}}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-a]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
  const a=t.dataset.a,id=t.dataset.id;
  ({add:()=>formMem(),edit:()=>formMem(id),del:()=>delItem("members",id),view:()=>viewMem(id),close:closeM,
    arr:showArrears,xls:()=>xlsMembers(false),pr:()=>printMembers(false),
    gadd:()=>formGen(t.dataset.c),gedit:()=>formGen(t.dataset.c,id),gdel:()=>delItem(t.dataset.c,id),
    uadd:formUser,udel:()=>delItem("users",id),
    parr:()=>printArrears(),xarr:()=>xlsMembers(true),addpay:addPayRow,addkid:addKidRow,rmkid:()=>t.closest(".kid").remove(),reidx:reindex,rmpay:()=>t.closest(".pay").remove()}[a]||(()=>{}))();
});
document.addEventListener("input",e=>{if(e.target.id==="q"&&S.role!=="viewer")fillTable()});
async function reindex(){if(!confirm("تحديث فهرس الاستعلام لكل الأعضاء؟"))return;try{for(const m of S.members)await idxSet(m);alert("تم تحديث الفهرس ("+S.members.length+" عضو)")}catch(e){alert("تعذر التحديث: "+e.code)}}
function closeM(){$("#modal").style.display="none"}
function openM(h){$("#mb").innerHTML=h;$("#modal").style.display="flex"}
async function delItem(c,id){if(!isAdmin())return;if(!confirm("تأكيد الحذف نهائياً؟"))return;try{if(c==="members"){const m=S.members.find(x=>x.id===id);if(m)try{await idxDel(m)}catch(e){}}await deleteDoc(doc(db,c,id));closeM()}catch(e){alert("تعذر الحذف: "+e.code)}}

// ---------- الأفراد والاستعلام ----------
function vInq(){if(S.role==="viewer")return `<h2>الاستعلام</h2><div class="bar"><input id="q" placeholder="اكتب الاسم كاملاً أو الرقم القومي أو اسم العائلة"><button id="vs">بحث</button></div><div class="tw" id="tbl"></div>`;return `<h2>الاستعلام</h2><div class="bar"><input id="q" placeholder="ابحث بالاسم أو الرقم القومي أو اسم العائلة"></div><div class="tw" id="tbl"></div>`}
function vMem(){return `<div class="bar"><h2 style="margin:0">الأفراد</h2><input id="q" placeholder="ابحث بالاسم أو الرقم القومي أو اسم العائلة">
${canEdit()?'<button data-a="add">+ إضافة عضو</button>':""}${isAdmin()?'<button class="sec" data-a="reidx">تحديث فهرس الاستعلام</button>':""}<button class="sec" data-a="arr">كشف المتأخرات</button><button class="sec" data-a="pr">طباعة</button><button class="sec" data-a="xls">تصدير Excel</button></div><div class="tw" id="tbl"></div>`}
const filt=()=>{const q=nm($("#q")?.value);return S.members.filter(m=>!q||[m.fullName,m.nid,m.family].some(x=>String(x||"").includes(q)))};
function fillTable(){if(S.role==="viewer"&&!S.vres){$("#tbl").innerHTML='<div class="empty">اكتب الاسم كاملاً أو الرقم القومي أو اسم العائلة ثم اضغط بحث</div>';return}if(S.tab==="inq"&&S.role!=="viewer"&&!nm($("#q")?.value)){$("#tbl").innerHTML='<div class="empty">اكتب اسماً أو رقماً قومياً أو اسم عائلة لإظهار النتائج</div>';return}const L=S.role==="viewer"?S.vres:filt();$("#tbl").innerHTML=L.length?`<table><tr><th></th><th>الاسم</th><th>الرقم القومي</th><th>الهاتف</th><th>العائلة</th><th>السن</th><th>العضوية</th><th>متأخرات</th><th></th></tr>`+
L.map(m=>{const a=arrears(m);return `<tr><td>${m.photo?`<img class="av" src="${m.photo}">`:'<div class="av"></div>'}</td><td>${esc(m.fullName)}</td><td>${esc(m.nid)}</td><td>${esc(m.phone)}</td><td>${esc(m.family)}</td><td>${age(m.birth)}</td><td>${esc(m.status)}</td>
<td>${a.length?`<span class="tag">${a.length} سنة</span>`:'<span class="tag ok">منتظم</span>'}</td><td style="white-space:nowrap"><button class="sm sec" data-a="view" data-id="${m.id}">عرض</button>
${canEdit()&&S.tab==="mem"?` <button class="sm" data-a="edit" data-id="${m.id}">تعديل</button>`:""}${isAdmin()&&S.tab==="mem"?` <button class="sm red" data-a="del" data-id="${m.id}">حذف</button>`:""}</td></tr>`}).join("")+"</table>":'<div class="empty">لا توجد نتائج</div>'}
function viewMem(id){const m=(S.role==="viewer"?S.vres:S.members).find(x=>x.id===id);if(!m)return;const a=arrears(m);
openM(`<div style="display:flex;gap:14px;align-items:center">${m.photo?`<img class="av" style="width:90px;height:90px" src="${m.photo}">`:""}<h2>${esc(m.fullName)}</h2></div><div class="det">
<div>الرقم القومي: ${esc(m.nid)}</div><div>الهاتف: ${esc(m.phone)}</div><div>العنوان: ${esc(m.address)}</div><div>تاريخ الميلاد: ${esc(m.birth)} (السن ${age(m.birth)})</div>
<div>المهنة: ${esc(m.job)}</div><div>تاريخ الاشتراك: ${esc(m.joinDate)}</div><div>اسم العائلة: ${esc(m.family)}</div><div>حالة العضوية: ${esc(m.status)}</div>
<div class="full" style="grid-column:1/-1">سنوات عدم السداد: ${a.length?a.join("، "):"لا يوجد"}</div><div style="grid-column:1/-1">ملاحظات: ${esc(m.notes)}</div></div>
<b>الأولاد</b><table><tr><th>الاسم</th><th>تاريخ الميلاد</th><th>السن</th></tr>${(m.children||[]).map(k=>`<tr><td>${esc(k.name)}</td><td>${esc(k.birth)}</td><td>${age(k.birth)}</td></tr>`).join("")||'<tr><td colspan="3">لا يوجد</td></tr>'}</table><br><b>إيصالات السداد</b><table><tr><th>السنة</th><th>رقم الإيصال</th><th>تاريخ الإيصال</th></tr>${(m.payments||[]).sort((x,y)=>x.year-y.year).map(p=>`<tr><td>${esc(p.year)}</td><td>${esc(p.receipt)}</td><td>${esc(p.date)}</td></tr>`).join("")||'<tr><td colspan="3">لا يوجد</td></tr>'}</table>
<p><button class="sec" data-a="close">إغلاق</button></p>`)}
function payRow(p={}){return `<div class="pay"><input type="number" placeholder="السنة" value="${esc(p.year)}" class="py"><input placeholder="رقم الإيصال" value="${esc(p.receipt)}" class="pr"><input type="date" value="${esc(p.date)}" class="pd"><button class="sm red" data-a="rmpay" type="button">×</button></div>`}
function kidRow(k={}){return `<div class="kid"><input placeholder="اسم الابن / الابنة" value="${esc(k.name)}" class="kn"><input type="date" value="${esc(k.birth)}" class="kb"><button class="sm red" data-a="rmkid" type="button">×</button></div>`}
function addKidRow(){$("#kids").insertAdjacentHTML("beforeend",kidRow())}
function addPayRow(){$("#pays").insertAdjacentHTML("beforeend",payRow())}
function formMem(id){if(!canEdit())return;const m=S.members.find(x=>x.id===id)||{payments:[]};const f=(k,l,t="text",x="")=>`<div ${x}><label>${l}</label><input id="f_${k}" type="${t}" value="${esc(m[k])}"></div>`;
openM(`<h2>${id?"تعديل عضو":"إضافة عضو"}</h2><div class="grid">${f("fullName","الاسم رباعي *","text",'class="full"')}${f("nid","الرقم القومي (14 رقم) *")}${f("phone","رقم الهاتف")}${f("address","العنوان ومحل الإقامة","text",'class="full"')}
${f("birth","تاريخ الميلاد","date")}${f("job","المهنة")}${f("joinDate","تاريخ الاشتراك","date")}${f("family","اسم العائلة")}
<div><label>حالة العضوية</label><select id="f_status">${STATUS.map(s=>`<option ${m.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
<div><label>الصورة الشخصية</label><input type="file" id="f_photo" accept="image/*"></div>
<div class="full"><label>ملاحظات</label><textarea id="f_notes" rows="2">${esc(m.notes)}</textarea></div>
<div class="full"><label>الأولاد (الاسم – تاريخ الميلاد)</label><div id="kids">${(m.children||[]).map(kidRow).join("")}</div><button class="sm sec" data-a="addkid" type="button">+ إضافة ابن / ابنة</button></div>
<div class="full"><label>إيصالات السداد (سنة السداد – رقم الإيصال – تاريخه). السنوات غير المسجلة منذ الاشتراك تُحتسب متأخرات تلقائياً.</label><div id="pays">${(m.payments||[]).map(payRow).join("")}</div><button class="sm sec" data-a="addpay" type="button">+ إضافة سنة مسددة</button></div></div>
<p><button id="save">حفظ</button> <button class="sec" data-a="close">إلغاء</button></p><div class="err" id="ferr"></div>`);
if(id)$("#f_nid").disabled=true;$("#save").onclick=async()=>{const g=k=>nm($("#f_"+k).value),d={fullName:g("fullName"),nid:g("nid"),phone:g("phone"),address:g("address"),birth:g("birth"),job:g("job"),joinDate:g("joinDate"),family:g("family"),status:$("#f_status").value,notes:g("notes"),
payments:[...document.querySelectorAll(".pay")].map(r=>({year:+r.querySelector(".py").value,receipt:nm(r.querySelector(".pr").value),date:r.querySelector(".pd").value})).filter(p=>p.year),children:[...document.querySelectorAll(".kid")].map(r=>({name:nm(r.querySelector(".kn").value),birth:r.querySelector(".kb").value})).filter(k=>k.name)};
const er=t=>$("#ferr").textContent=t;if(!d.fullName)return er("الاسم مطلوب");if(!/^\d{14}$/.test(d.nid))return er("الرقم القومي يجب أن يكون 14 رقماً");
if(S.members.some(x=>x.nid===d.nid&&x.id!==id))return er("الرقم القومي مسجل لعضو آخر");
const yrs=d.payments.map(p=>p.year);if(new Set(yrs).size!==yrs.length)return er("سنة سداد مكررة");
d.photo=m.photo||"";const fl=$("#f_photo").files[0];if(fl){try{d.photo=await shrink(fl)}catch(e){return er("تعذر قراءة الصورة")}}
d.updatedBy=S.email;try{if(id){d.nid=m.nid;await updateDoc(doc(db,"members",id),d);if(nk(m.fullName)!==nk(d.fullName)||nk(m.family)!==nk(d.family))await idxDel(m)}else{d.createdBy=S.email;await setDoc(doc(db,"members",d.nid),d)}await idxSet(d);closeM()}catch(e){er("تعذر الحفظ: "+e.code)}}}
function shrink(file){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,180/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};i.onerror=no;i.src=URL.createObjectURL(file)})}

// ---------- المتأخرات / طباعة / Excel ----------
const arrRows=()=>S.members.map(m=>({m,a:arrears(m)})).filter(x=>x.a.length);
function showArrears(){const R=arrRows();openM(`<h2>كشف المتأخرات (${R.length})</h2><div class="tw"><table><tr><th>الاسم</th><th>الرقم القومي</th><th>الهاتف</th><th>سنوات عدم السداد</th><th>عددها</th></tr>${R.map(({m,a})=>`<tr><td>${esc(m.fullName)}</td><td>${esc(m.nid)}</td><td>${esc(m.phone)}</td><td>${a.join("، ")}</td><td>${a.length}</td></tr>`).join("")||'<tr><td colspan="5">لا توجد متأخرات</td></tr>'}</table></div><p><button data-a="parr">طباعة</button> <button class="sec" data-a="xarr">تصدير Excel</button> <button class="sec" data-a="close">إغلاق</button></p>`)}
function doPrint(title,html){$("#printArea").innerHTML=`<h2>جمعية أبناء زرنيخ – ${title}</h2><p style="text-align:center">${new Date().toLocaleDateString("ar-EG")}</p>`+html;window.print()}
function printArrears(){doPrint("كشف المتأخرات",`<table border="1"><tr><th>الاسم</th><th>الرقم القومي</th><th>الهاتف</th><th>السنوات</th><th>العدد</th></tr>${arrRows().map(({m,a})=>`<tr><td>${esc(m.fullName)}</td><td>${esc(m.nid)}</td><td>${esc(m.phone)}</td><td>${a.join("، ")}</td><td>${a.length}</td></tr>`).join("")}</table>`)}
function printMembers(){doPrint("كشف الأعضاء",`<table border="1"><tr><th>الاسم</th><th>الرقم القومي</th><th>الهاتف</th><th>العائلة</th><th>العضوية</th></tr>${filt().map(m=>`<tr><td>${esc(m.fullName)}</td><td>${esc(m.nid)}</td><td>${esc(m.phone)}</td><td>${esc(m.family)}</td><td>${esc(m.status)}</td></tr>`).join("")}</table>`)}
function xlsMembers(onlyArr){const rows=(onlyArr?arrRows().map(x=>x.m):filt()).map(m=>({"الاسم":m.fullName,"الرقم القومي":m.nid,"الهاتف":m.phone,"العنوان":m.address,"تاريخ الميلاد":m.birth,"السن":age(m.birth),"المهنة":m.job,"تاريخ الاشتراك":m.joinDate,"اسم العائلة":m.family,"حالة العضوية":m.status,"سنوات عدم السداد":arrears(m).join("، "),"الأولاد":(m.children||[]).map(k=>`${k.name} (${k.birth||"-"}، ${age(k.birth)} سنة)`).join(" | "),"الإيصالات":(m.payments||[]).map(p=>`${p.year}: ${p.receipt} (${p.date})`).join(" | "),"ملاحظات":m.notes}));
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"البيانات");wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,onlyArr?"كشف-المتأخرات.xlsx":"الأعضاء.xlsx")}

// ---------- الدورات ومجلس الإدارة ----------
const GEN={courses:{t:"الدورات",f:[["name","اسم الدورة"],["date","التاريخ","date"],["place","المكان"],["trainer","المحاضر / الجهة"],["attendees","أسماء المشاركين","area"],["notes","ملاحظات","area"]]},
board:{t:"مجلس الإدارة",f:[["name","الاسم"],["position","المنصب"],["phone","الهاتف"],["from","بداية الدورة","date"],["to","نهاية الدورة","date"],["notes","ملاحظات","area"]]}};
function vGen(c){const G=GEN[c];return `<div class="bar"><h2 style="margin:0">${G.t}</h2>${canEdit()?`<button data-a="gadd" data-c="${c}">+ إضافة</button>`:""}</div><div class="tw">${S[c].length?`<table><tr>${G.f.slice(0,5).map(x=>`<th>${x[1]}</th>`).join("")}<th></th></tr>${S[c].map(r=>`<tr>${G.f.slice(0,5).map(x=>`<td>${esc(r[x[0]])}</td>`).join("")}<td style="white-space:nowrap">${canEdit()?`<button class="sm" data-a="gedit" data-c="${c}" data-id="${r.id}">تعديل</button>`:""}${isAdmin()?` <button class="sm red" data-a="gdel" data-c="${c}" data-id="${r.id}">حذف</button>`:""}</td></tr>`).join("")}</table>`:'<div class="empty">لا توجد بيانات</div>'}</div>`}
function formGen(c,id){if(!canEdit())return;const G=GEN[c],r=S[c].find(x=>x.id===id)||{};
openM(`<h2>${G.t}</h2><div class="grid">${G.f.map(([k,l,t])=>`<div ${t==="area"?'class="full"':""}><label>${l}</label>${t==="area"?`<textarea id="g_${k}" rows="3">${esc(r[k])}</textarea>`:`<input id="g_${k}" type="${t||"text"}" value="${esc(r[k])}">`}</div>`).join("")}</div><p><button id="gs">حفظ</button> <button class="sec" data-a="close">إلغاء</button></p><div class="err" id="ferr"></div>`);
$("#gs").onclick=async()=>{const d={};G.f.forEach(([k])=>d[k]=nm($("#g_"+k).value));if(!d.name)return $("#ferr").textContent="الاسم مطلوب";d.updatedBy=S.email;try{id?await updateDoc(doc(db,c,id),d):await addDoc(collection(db,c),d);closeM()}catch(e){$("#ferr").textContent="تعذر الحفظ: "+e.code}}}

// ---------- المستخدمون (للمدير فقط) ----------
function vUsr(){return `<div class="bar"><h2 style="margin:0">المستخدمون المسموح لهم (Gmail)</h2><button data-a="uadd">+ إضافة / تعديل مستخدم</button></div><div class="tw"><table><tr><th>البريد</th><th>الاسم</th><th>الصلاحية</th><th></th></tr><tr><td>${ROOT}</td><td>المدير الرئيسي</td><td>مدير النظام</td><td></td></tr>${S.users.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${ROLES[u.role]||""}</td><td><button class="sm red" data-a="udel" data-id="${u.id}">حذف</button></td></tr>`).join("")}</table></div>`}
function formUser(){openM(`<h2>إضافة / تعديل مستخدم</h2><div class="grid"><div class="full"><label>بريد Gmail</label><input id="u_e" type="email" placeholder="name@gmail.com"></div><div><label>الاسم</label><input id="u_n"></div><div><label>الصلاحية</label><select id="u_r">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div></div><p><button id="us">حفظ</button> <button class="sec" data-a="close">إلغاء</button></p><div class="err" id="ferr"></div>`);
$("#us").onclick=async()=>{const e=nm($("#u_e").value).toLowerCase();if(!/^[^@\s]+@gmail\.com$/.test(e))return $("#ferr").textContent="أدخل بريد Gmail صحيحاً";try{await setDoc(doc(db,"users",e),{role:$("#u_r").value,name:nm($("#u_n").value)});closeM()}catch(x){$("#ferr").textContent="تعذر الحفظ: "+x.code}}}
</script>
